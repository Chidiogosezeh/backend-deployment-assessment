services:
  backend:
    image: karispearl/muchtodo-backend:latest
    build: .
    container_name: muchtodo-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./.env:/app/.env:ro
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - appnet

  mongo:
    image: mongo:7.0
    container_name: muchtodo-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - appnet

volumes:
  mongo_data:

networks:
  appnet: